tests:
  - id: 'MR Rev2 decode — V @40907 (bench 2026-10-22)'
    description: 'Raw words at hr:906 match ~224–230 V with ccli word-swap decode'
    input:
      - firstAddress: 'hr:00906'
        rawValues: |-
          C3EA 435F
    blocks:
      - id: 'realtime_rms'
        expected:
          'V_L1_N RMS': [223.765]
