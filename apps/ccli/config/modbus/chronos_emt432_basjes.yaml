# $schema: https://modbus.basjes.nl/v2/ModbusSchema.json
#
# Chronos EMT430/432 — holding register map (EMT430_MR Rev2)
# Cross-check: lab/conformance/EMT432_MR_REGISTER_VALIDATION.md
# ccli runtime: lab_tr400_emt432_lan3_tcp_102.yaml (reg_* offsets match hr: below)
#
# Addressing: hr:OOSSS = holding offset from 40001 (same as pymodbus / ccli reg_*).
# Float32 on EMT432 TCP: low Modbus word first — ccli float_word_swap: true.
# Basjes ieee754_32() uses register order as on wire; verify decode vs probe on bench.
#
# Modbus Schema Toolkit — https://modbus.basjes.nl/ (Apache 2.0, Niels Basjes)

description: 'Chronos EMT432.V / EMT430 family — 1P bench RMS (EMT430_MR Rev2)'
schemaFeatureLevel: 2
maxRegistersPerModbusRequest: 80

blocks:
  - id: 'realtime_rms'
    description: 'Instantaneous RMS block 40907–40973 (40906 is u16 alarm — not V)'
    fields:
      - id: 'V_L1_N RMS'
        description: 'Star voltage L1-N [V] — MR PLC 40907, NOT 40906'
        expression: 'ieee754_32(hr:00906 # 2)'
        unit: 'Volts'

      - id: 'I_L1 RMS'
        description: 'Line current L1 [A] — MR PLC 40923'
        expression: 'ieee754_32(hr:00922 # 2)'
        unit: 'Amps'

      - id: 'P1 RMS'
        description: 'Active power line 1 [W] — MR PLC 40933'
        expression: 'ieee754_32(hr:00932 # 2)'
        unit: 'Watts'

      - id: 'Q1 RMS'
        description: 'Reactive power line 1 [VAR] — MR PLC 40941'
        expression: 'ieee754_32(hr:00940 # 2)'
        unit: 'VAr'

      - id: 'P_SUM RMS'
        description: 'Sum active power [W] — MR PLC 40939 (1P often equals P1)'
        expression: 'ieee754_32(hr:00938 # 2)'
        unit: 'Watts'

      - id: 'Frequency'
        description: 'Grid frequency [Hz] — MR PLC 40973'
        expression: 'ieee754_32(hr:00972 # 2)'
        unit: 'Hz'

  - id: 'realtime_rms_mr_full'
