# Two-PC bench + Chronos EMT432 on LAN3 (Modbus TCP @ 192.168.178.250).
# MMS TLS :3782 (LAN1) · 104 :2404 (LAN2) · plant reads via TCP (not RS485 mock).
# DUT lan3 UCI: network.lan2_sec.ipaddr=192.168.178.1/24
# PC plant: lab/set_pc_lan3_plant_178.cmd → 192.168.178.10/24
# Probe: python lab/modbus_emt432_tcp_probe.py --host 192.168.178.250
#
# Deploy only after Modbus TCP :502 verified on meter (display / web UI).
# deploy-ccli-session-fix.ps1 -HostAddr 192.168.10.1 -LabYaml .../lab_tr400_phase4_emt432_lan3_tcp.yaml

platform: tg500
lab:
  hostname: TG544
  model: tespro,tr500
  address: 192.168.1.130/24
  role: operator_eth_b
  meter: chronos_emt432_1p
  meter_ip: 192.168.178.250
  plant_gateway: 192.168.178.1
  bench_note: "TSP+104+EMT432 LAN3 .178.x · SN 261001102952 · 5A TA no CT"

modbus:
  backend: tcp
  host: 192.168.178.250
  tcp_port: 502
  slave_id: 1
  poll_ms: 4000
  timeout_ms: 2000
  retries: 3
  trace: true
  reg_active_power: 932
  reg_active_power_count: 2
  reg_reactive_power: 940
  reg_reactive_power_count: 2
  power_scale: 0.001
  reactive_scale: 0.001
  float_word_swap: true

pf2:
  threshold_kw: 900
  debounce_s: 30
  release_threshold_kw: 850
  min_on_s: 60
  min_off_s: 30
  stale_data_s: 10
  use_dso_mock: true

plant:
  p_imm_kw: 200
  p_ass_kw: 200
  q_ind_kvar: 50
  q_cap_kvar: 50
  smax_kva: 210
  poc_ppv_kv: 0.23

dso:
  enabled: true
  profile: tr57126_table1
  w110_active: false
  w110_pct: 100
  wlim_active: false
  wmax_spt_pct: 0
  wsd_active: true
  wspt_pct: 20
  release_delta_kw: 5

mms:
  enabled: true
  bind_address: 192.168.10.1
  tcp_port: 3782
  model_cfg: /etc/ccli/icd/lab_tg544_eth_a.cfg
  comms_loss_fallback_s: 15
  gnss_poll_s: 15
  gnss_discipline_clock: false
  chrony_poll: true
  tls_enabled: true
  tls_own_key: /etc/ccli/tls/server.key
  tls_own_cert: /etc/ccli/tls/server_tls.pem
  tls_acse_cert: /etc/ccli/tls/server.pem
  tls_acse_key: /etc/ccli/tls/server_acse.key
  tls_ca_cert: /etc/ccli/tls/root_CA.pem
  tls_client_cert: /etc/ccli/tls/client_tls.pem
  tls_acse_client_cert: /etc/ccli/tls/client.pem
  tls_viewer_cert: /etc/ccli/tls/viewer_tls.pem
  tls_revoked_cert: /etc/ccli/tls/revoked_tls.pem
  tls_crl: /etc/ccli/tls/lab_crl.pem
  tls_chain_validation: true

iec104:
  enabled: true
  bind_address: 192.168.1.130
  tcp_port: 2404
  common_address: 1
  periodic_s: 4
  comms_loss_fallback_s: 60
  operator_rule_mode: monitor_only
  operator_allow_commands: false
  operator_allow_gi: true
  operator_allow_clock_sync: false
  operator_monitor_tot_w: true
  ioa_tot_w: 1001
  operator_monitor_totvar: false
  ioa_tot_var: 1002
  operator_monitor_ppv: false
  ioa_ppv: 1003
  tls_enabled: true
  tls_own_key: /etc/ccli/tls/server.key
  tls_own_cert: /etc/ccli/tls/server_tls.pem
  tls_ca_cert: /etc/ccli/tls/root_CA.pem
  tls_client_cert: /etc/ccli/tls/client_tls.pem

io:
  backend: ubus_dido_v2
  permissive_bypass: false
  do_curtail:
    gpio: 1
    active_high: false
  di_permissive:
    gpio: 2
    active_low: true

event_log:
  enabled: true
  path: /var/lib/ccli/events.jsonl
  syslog_enabled: true
  syslog_host: 127.0.0.1
  syslog_port: 514
  watch_ifaces: lan1 lan2 lan3
