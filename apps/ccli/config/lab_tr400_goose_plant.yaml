# Lab — plant LAN GOOSE subscribe (Annex T Type 1 optional path).
# DSO path remains MMS TLS on Eth_A (:3782 product / :102 TSP lab bypass).
# Modbus RTU remains default plant acquisition on A2/B2 (P5-R01 PASS).
#
# Enable only when a GOOSE publisher is on the same L2 segment as the plant interface.
# Example: inverter IED publishing MMTR or inverter status on br-lan / dedicated lan3.
#
# Deploy (after cross-build + scp):
#   ccli --config /etc/ccli/lab_tr400_goose_plant.yaml
#
# Wireshark filter: eth.dst == 01:0c:cd:01:00:01 && goose

platform: tg500

modbus:
  backend: rtu
  device: /dev/ttyS2
  baud: 9600
  parity: N
  slave_id: 1
  poll_ms: 4000
  timeout_ms: 2000
  retries: 3
  trace: true

pf2:
  threshold_kw: 900
  debounce_s: 30
  release_threshold_kw: 850
  min_on_s: 60
  min_off_s: 30
  stale_data_s: 10
  use_dso_mock: true

plant:
  p_imm_kw: 200
  p_ass_kw: 200
  q_ind_kvar: 50
  q_cap_kvar: 50
  smax_kva: 210
  poc_ppv_kv: 20.0

dso:
  enabled: true
  profile: tr57126_table1
  w110_active: false
  w110_pct: 100
  wlim_active: false
  wmax_spt_pct: 0
  wsd_active: true
  wspt_pct: 20
  release_delta_kw: 5

mms:
  enabled: true
  bind_address: 0.0.0.0
  tcp_port: 102
  model_cfg: /etc/ccli/icd/lab_tg544_eth_a.cfg
  comms_loss_fallback_s: 15
  gnss_poll_s: 15
  gnss_discipline_clock: false
  chrony_poll: true
  tls_enabled: false

iec104:
  enabled: false

# Plant GOOSE — subscribe only (publisher optional / P5-G02 backlog)
goose:
  enabled: false
  publish_enabled: true
  interface: br-lan
  # Replace with publisher GoCB ref from SCD/CID (MMS notation):
  subscribe_go_cb_ref: "plantINV1/LLN0.gcbStatus"
  subscribe_app_id: 0
  subscribe_dst_mac: ""
  publish_enabled: false
  publish_app_id: 0x0001
  publish_dst_mac: "01:0c:cd:01:00:01"
  publish_vlan_id: 0
  publish_interval_ms: 1000

io:
  backend: ubus_dido_v2
  permissive_bypass: true
  do_curtail:
    gpio: 1
    active_high: false
  di_permissive:
    gpio: 2
    active_low: true
  annex_m_trip_monitor:
    enabled: true
    gpio: 3

event_log:
  enabled: true
  path: /var/log/ccli-events.jsonl
