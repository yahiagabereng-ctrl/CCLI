# ---------------------------------------------------------------------------
# Nameplate Smax — T.3.1 Table 80 / O.8.2
# ---------------------------------------------------------------------------
nameplate:
  smax:
    clause: [O.8.2, T.3.1]
    annex_t_table: "Table 80"
    equation: eq1
    regulation_id: R01
    id: PdC_VA.VARtg
    unit: kVA
    lab_yaml: plant.smax_kva
    code: "plant_envelope.hpp smax_kva_effective()"
    runtime_status: PART
    note: "Authoritative Smax from Operating Rule; % setpoints refer to this base"

# ---------------------------------------------------------------------------
# Plant-element MMXU2 (Figura 2 GenPV / GenTer / GenIdr / Accumulo)
# ---------------------------------------------------------------------------
plant_elements:
  clause: [O.8.4, T.3.3.1.1.7]
  runtime_status: DEFERRED
  note: "Prefixes GenPV, GenTer, GenIdr, St, SGG — instance per plant design"
  deferred:
    - GenPV MMXU2 TotW
    - GenTer MMXU2 TotW
    - GenIdr MMXU2 TotW
    - St MMXU2 TotW (Accumulo)
    - SGG MMXU2 TotW N=1..99
    - XCBR1.IDG Pos (breaker)

# ---------------------------------------------------------------------------
# SINGLE ASSIGNMENT PLANE — all 31 LNs of lab_tg544_eth_a.cid LD_Plant
# One row per LN: application group · protocol exposure (MMS report / control,
# GOOSE dataset) · values (CID defaults) · rule / equation · physical binding.
#
# application_group keys (Berlin-style mapping key, A0–A8):
#   A0 common       LLN0 / LPHD              — reports, GOOSE control blocks, health
#   A1 nameplate    DPCC                     — Smax polygon corners (Eq 1 base)
#   A2 availability DisFR DECP/DGEN/DSTO     — plant element availability flags
#   A3 measurement  MMXU                     — PdC + per-source 4 s measurements
#   A4 breaker      XCBR                     — IDG position / block (status-only)
#   A5 gen_group    SSGG DGEN2               — single generation group identity / health
#   A6 active_ctrl  Wlim DWMX / WSd DAGC     — DSO active-P functions (Eq 2,4,5,6,9)
#   A7 reactive_ctrl VArSd/PFSP/VArV/PFW     — DSO reactive functions (Eq 3,10,11,12)
#   A8 curve_params VArV DPMC/DECP, PFW DO   — curve breakpoints for Eq 10 / 11
#
# binding.kind: modbus | gpio | yaml | mms_client | goose_sub | none
# protocol: mms_report (dataset) · mms_control (ctlModel) · goose (gcb)
# ---------------------------------------------------------------------------
application_groups:
  A0: {name: common,        count: 2}
  A1: {name: nameplate,     count: 5}
  A2: {name: availability,  count: 3}
  A3: {name: measurement,   count: 8}
  A4: {name: breaker,       count: 1}
  A5: {name: gen_group,     count: 2}
  A6: {name: active_ctrl,   count: 2}
  A7: {name: reactive_ctrl, count: 4}
  A8: {name: curve_params,  count: 4}
  total_ln: 31

goose_map:
  - gcb: LD_Plant/LLN0.gcb_PdC_Mis4sec
    app_id: 0x1000
    dataset: DS_R_PdC_Mis4sec
    members: [PdCMMXU1.TotW, PdCMMXU1.TotVAr, PdCMMXU1.PPV, PdCMMXU1.A]
    direction: publish
    runtime_status: IMPL   # P5-G02 integrated IedServer publish
  - gcb: LD_Plant/LLN0.gcb_Stato_Allarmi
    app_id: 0x1001
    dataset: DS_R_Stato_Allarmi_Segnali
    members: [DisFRDECP1.Beh, DisFRDGEN1.Beh, DisFRDSTO1.Beh, IDGXCBR1.Pos, SSGGDGEN1.Health, SSGGDGEN2.Health,
              WlimDWMX1.Beh, WlimDWMX1.FctOpStAuto, WlimDWMX1.FctOpStEx, WSdDAGC1.Beh, WSdDAGC1.FctOpSt,
              VArSdDVAR1.Beh, VArSdDVAR1.FctOpSt, PFSPDFPF1.Beh, PFSPDFPF1.FctOpSt,
              VArVDVVR1.Beh, VArVDVVR1.FctOpSt, PFWDPFW1.Beh, PFWDPFW1.FctOpSt]
