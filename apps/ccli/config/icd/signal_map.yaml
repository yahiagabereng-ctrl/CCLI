# CCLI — IEC 61850 object map (Figura 2 / Annex O+T)
# Date: 2026-10-03 (rev 2 — equations index + 31-LN single plane; r29)
# Status: PRODUCT freeze — hierarchy + clauses; runtime IMPL status per object
# NOTE:  Documentation / traceability plane. NOT loaded by ccli at runtime
#        (runtime model = lab_tg544_eth_a.cfg; bindings = lab yaml + C++).
# Norm:  CEI 0-16 Allegato O · Allegato T · TR 57-126 Figura 2
# CID:   lab_tg544_eth_a.cid | cei-tr-57-126-example.cid (reference)
#
# Hierarchy (Annex T T.3.3.1):
#   IED CCI016_01
#     └─ LD LD_Plant
#          ├─ LLN0                    reports / common
#          ├─ WlimDWMX1               O.9.2.2 lim W     (Figura 2)
#          ├─ WSdDAGC1                O.9.2.3 s.p. W    (Figura 2 green)
#          ├─ WSaDAGC1                O.10.3.1 MSD      (discretionary)
#          ├─ VArSdDVAR1              O.9.1.4 s.p. Q
#          ├─ PFSPDFPF1               O.9.1   s.p. cosφ
#          ├─ VArVDVVR1               O.9.1.3 Q(V)
#          ├─ PFWDPFW1                O.9.1.2 Cosφ(P)
#          └─ PdCMMXU1                O.8.3 / T.3.1.3 measurements @ PdC
#
# Naming: prefix + LN class + instance  (e.g. Wlim + DWMX + 1 → WlimDWMX1)
# Italian Tab. ↔ EN Table: Wlim Tab.84/EN85 · WSd Tab.85/EN86 · WSa Tab.86/EN87

meta:
  ied_name: CCI016_01
  ld_inst: LD_Plant
  access_point: accessPoint1
  eth_role: Eth_A
  eth_ip: 192.168.10.1
  namespace: "(Tr) IEC 61850-CEI016:2022"
  figura2_source: "CEI TR 57-126 §6.2 Table 1 / Figura 2"
  code_runtime: apps/ccli/adapters/iec61850_mms/mms_adapter.cpp
  code_math: apps/ccli/core/dso/
  code_actuation: apps/ccli/core/pf2/pf2_fsm.cpp
  notes:
    - "O.11 priority: W110 > Wlim > WSd > WSa > reactive (min of simultaneous export caps in Phase-1 arbiter)."
    - "W110 is autonomous (O.9.2.1); exposed as yaml/math, not a separate DSO LN in Allegato T tables."
    - "Product ctlModel: SBO-with-enhanced-security; lab uses DIRECT_ENHANCED."
    - "Roadmap: TotVAr/PPV + O.9.1 reactive → Phase 5 (P5-M / P5-R). See lab/CCI_Reactive_Roadmap_Gap_Report.md."
    - "Equation traceability: Flowcharts/ANNEX_EQUATION_UTILIZATION_MATRIX.md (one row per Eq)."

# ---------------------------------------------------------------------------
# Annex equation index — every control / measurement entry below references
# one of these ids. Verdicts mirror ANNEX_EQUATION_UTILIZATION_MATRIX.md.
#   USED · USED-LAB · PART · TEST-ONLY · DOC
# ---------------------------------------------------------------------------
equations:
  eq1:
    clause: O.8.2
    formula: "Smax = sqrt(max(Pimm^2,Pass^2) + max(Qind^2,Qcap^2))"
    regulation_id: R01
    code: "core/dso/plant_envelope.hpp calc_smax_kva / smax_kva_effective"
    drawio_ref: null
    rag: "Flowcharts/PARAMETERS_AND_EQUATIONS.md §2 · lab/CCI_Figura2_Parameters.md"
    verdict: USED
  eq2:
    clause: O.9.2.x
    formula: "P_kW = pct/100 * Smax_kVA"
    regulation_id: [R02, R03, R04]
    code: "core/dso/plant_envelope.hpp pct_smax_to_kw"
    drawio_ref: ["Flowcharts/DSO_P_limit O_9_2_2.drawio", "Flowcharts/DSO_P_modulation_O_9_2_3_.drawio", "Flowcharts/Lim W110 O.9.2.1.drawio"]
    rag: "PARAMETERS §3"
    verdict: USED
  eq3:
    clause: [O.9.1.4, O.10.3.2]
    formula: "Q_kVAr = VArSptPct/100 * Smax_kVA (signed: + cap / − ind)"
    regulation_id: R13
    code: "core/dso/dso_reactive_power.cpp derive_reactive_kvar → modbus write_reactive_kvar"
    drawio_ref: "Flowcharts/V.ctrl.Q.on.DSO.NotConfirmed.drawio"
    rag: "PARAMETERS §10 · Annex T Tab. 88/89"
    verdict: USED-LAB
  eq4:
    clause: O.9.2.3
    formula: "WSptPct in [-100,+100]; + export, − import"
    regulation_id: R03
    code: "derive_active_power_kw uses max(0,pct) — import ignored"
    drawio_ref: "Flowcharts/DSO_P_modulation_O_9_2_3_.drawio"
    verdict: PART
  eq5_6:
    clause: O.11
    formula: "P_eff = min(active export caps kW); order W110 > Wlim > WSd"
    regulation_id: R05
    code: "core/dso/dso_active_power.cpp derive_active_power_kw"
    drawio_ref: ["Flowcharts/DSO_P_limit O_9_2_2.drawio", "Flowcharts/DSO_P_modulation_O_9_2_3_.drawio", "Flowcharts/Lim W110 O.9.2.1.drawio"]
    rag: "knowledge-base/08-engineering/CCI_Annex_O_Extract.md §8 Table 1"
    verdict: USED
    gap: "active-P tier only; WSa + reactive tiers not arbitrated"
  eq7_8:
    clause: O.7.3.1
    formula: "|P-Pexp|/|Pexp| <= 5% within TsP <= 60 s; TsQ <= 10 s"
    regulation_id: R06
    code: "settled_within_band_kw() — unit test + live bench band only"
    drawio_ref: "Flowcharts/Q(V).not confirmed.drawio (fast ring ±5 %)"
    verdict: TEST-ONLY
    gap: "no runtime settling timer / TsQ"
  eq9:
    clause: O.7.3.3
    formula: "dt = t_now − t_last >= 3 s else reject set-point"
    regulation_id: R07
    code: "core/dso/setpoint_gate.hpp SetpointSpacingGate → mms_adapter setpoint_spacing_accept (WMaxSptPct, WSptPct, VArTgtSptPct)"
    config: "mms.setpoint_min_interval_s (default 3; 0 = off)"
    o14_event: "mms/setpoint_reject_spacing_o733"
    drawio_ref: "Flowcharts/DSO_P_limit O_9_2_2.drawio (DSO command validation node)"
    verdict: USED
    since: r29
  eq10:
    clause: [O.9.1.3, O.7.3.2]
    formula: "Q(V): zones V2i/V1i/V1s/V2s, Q_tgt = K*Qmax, lock-in 0.20 Pn, lock-out 0.05 Pn, dQ 5 % Qmax, dT 10–600 s"
    regulation_id: R10
    code: null
    drawio_ref: "Flowcharts/Q(V).not confirmed.drawio"
    verdict: DOC
  eq11:
    clause: [O.9.1.2, O.7.3.2]
    formula: "cosphi(P): A/B/C = 0.20/0.50/0.80 Pn → 1.00/1.00/0.95; dcosphi 0.02; Q = P*tan(acos(cosphi)); VLkIn 1.05 Vn"
    regulation_id: R11
    code: null
    drawio_ref: "Flowcharts/Cosfi(P).not confirmed.drawio"
    verdict: DOC
  eq12:
    clause: O.9.1.1
    formula: "PFSP direct cosphi: gen [-1..0], load [0..1]"
    regulation_id: R12
    code: null
    drawio_ref: "Flowcharts/cosfi. not confirmed.drawio"
    verdict: DOC
  eq13_17:
    clause: Lab PF2
    formula: "enter P > thr + debounce; release hysteresis; stale fail-safe"
    regulation_id: [L01, L02, L03]
    code: "core/pf2/pf2_fsm.cpp"
    drawio_ref: "Flowcharts/PF2_Equation_Dataflow.mermaid"
    verdict: USED
  eq18:
    clause: Lab
    formula: "P = 400 + 550*|1 − |(phi/60) − 1||, phi = t mod 120"
    regulation_id: L04
    code: "lab/modbus_rtu_slave.py --ramp · ccli --lab-demo"
    verdict: USED-LAB

# ---------------------------------------------------------------------------
# Figura 2 — lim W — O.9.2.2 / T Table 85 (EN) — LN DWMX prefix Wlim
# ---------------------------------------------------------------------------
controls:
  wlim:
    figura2: lim_W
    clause: [O.9.2.2, T.3.1.4, T.3.3.1.2.1]
    annex_t_table: "EN Table 85 / IT Tab. 84"
    equation: [eq2, eq5_6, eq9]
    regulation_id: [R02, R07]
    drawio_ref: "Flowcharts/DSO_P_limit O_9_2_2.drawio"
    o11_priority: 2
    ln_class: DWMX
    ln_type: DWMX1
    prefix: Wlim
    ln_inst: "1"
    reference_base: LD_Plant/WlimDWMX1
    runtime_status: IMPL
    objects:
      - id: Wlim.Mod
        do: Mod
        fc: ST
        cdc: ENC
        role: enable
        desc: "5=Inactive, 1=Active (default 5)"
        range: [5, 1]
        default: 5
        mms_path: LD_Plant/WlimDWMX1.Mod
        maps_to:
          struct: DsoActivePowerCommands
          field: wlim_active
          transform: "ctlVal 1 → true; 5 → false"
          code: "mms_adapter.cpp on_control → wlim.wlim_active"

      - id: Wlim.WMaxSptPct
        do: WMaxSptPct
        fc: CO
        cdc: APC
        role: setpoint_pct_smax
        desc: "Generation limit % of plant Smax [0..100]"
        range: [0, 100]
        default: 0
        unit: percent_Smax
        mms_path: LD_Plant/WlimDWMX1.WMaxSptPct
        maps_to:
          struct: DsoActivePowerCommands
          field: wmax_spt_pct
          transform: "p_wlim_kw = pct/100 * smax_kva"
          code: "dso_active_power.cpp derive_active_power_kw"

    actuation_path: >
      MMS → DsoLiveCommand → apply_live_dso_commands_to_pf2 →
      Pf2Fsm::set_thresholds → DIO1 (hal_gpio_ll / dido_v2)

  # ---------------------------------------------------------------------------
  # Figura 2 — s.p. W (green) — O.9.2.3 / T Table 86 (EN) — LN DAGC prefix WSd
  # ---------------------------------------------------------------------------
  wsd:
    figura2: s.p._W
    clause: [O.9.2.3, O.10.3.1, T.3.1.4, T.3.3.1.2.2]
    annex_t_table: "EN Table 86 / IT Tab. 85"
    equation: [eq2, eq4, eq5_6, eq7_8, eq9]
    regulation_id: [R03, R06, R07]
    drawio_ref: "Flowcharts/DSO_P_modulation_O_9_2_3_.drawio"
    o11_priority: 3
    ln_class: DAGC
    ln_type: DAGC1
    prefix: WSd
    ln_inst: "1"
    reference_base: LD_Plant/WSdDAGC1
    runtime_status: IMPL
    tr57126_figura2: "Operative / Active · WSptPct=+20 % Smax (example)"
    objects:
      - id: WSd.Mod
        do: Mod
        fc: ST
        cdc: ENC
        role: enable
        desc: "5=Inactive, 1=Active (default 5; TR Figura 2 uses Active)"
        range: [5, 1]
        default: 5
        mms_path: LD_Plant/WSdDAGC1.Mod
        maps_to:
          struct: DsoActivePowerCommands
          field: wsd_active
          transform: "ctlVal 1 → true; 5 → false"
          code: "mms_adapter.cpp on_control → live.wsd_active"

      - id: WSd.WSptPct
        do: WSptPct
        fc: CO
        cdc: APC
        role: setpoint_pct_smax_signed
        desc: "Feed-in (+) / feed-out (−) % Smax; Phase-1 FSM uses export max(0,pct)"
        range: [-100, 100]
        default: 100
        unit: percent_Smax
        mms_path: LD_Plant/WSdDAGC1.WSptPct
        maps_to:
          struct: DsoActivePowerCommands
          field: wspt_pct
          transform: "p_wsd_kw = max(0,pct)/100 * smax_kva"
          code: "dso_active_power.cpp derive_active_power_kw"

    actuation_path: >
      MMS → DsoLiveCommand → apply_live_dso_commands_to_pf2 →
      Pf2Fsm thresholds (O.11 min with Wlim/W110)

  # ---------------------------------------------------------------------------
  # Figura 2 — lim W110 — O.9.2.1 (autonomous; not a separate DSO LN)
  # ---------------------------------------------------------------------------
  w110:
    figura2: lim_W110
    clause: [O.9.2.1, O.11]
    equation: [eq2, eq5_6]
    regulation_id: R04
    drawio_ref: "Flowcharts/Lim W110 O.9.2.1.drawio"
    o11_priority: 1
    runtime_status: PART
    note: >
      Autonomous voltage near 110 % Un. Allegato T lists status on Wlim table
      (Limit function status P 110%), not a dedicated LN. Coded as yaml/math only.
    maps_to:
      struct: DsoActivePowerCommands
      fields: [w110_active, w110_pct]
      code: "dso_active_power.cpp · ccli_config dso.w110_*"
      missing: "PdC voltage input to arm automatically"

  # ---------------------------------------------------------------------------
  # Figura 2 — s.p. Q — O.9.1.4 / T Table 88 — LN DVAR prefix VArSd
  # ---------------------------------------------------------------------------
  varsd:
    figura2: s.p._Q
    clause: [O.9.1.4, T.3.1.4, T.3.3.1.2.3]
    annex_t_table: "EN Table 88"
    equation: [eq3, eq7_8, eq9]
    regulation_id: [R13, R07]
    drawio_ref: "Flowcharts/V.ctrl.Q.on.DSO.NotConfirmed.drawio"
    o11_priority: 5
    ln_class: DVAR
    prefix: VArSd
    reference_base: LD_Plant/VArSdDVAR1
    runtime_status: IMPL
    objects:
      - id: VArSd.Mod
        do: Mod
        cdc: ENC
        default: 5
        mms_path: LD_Plant/VArSdDVAR1.Mod
        maps_to: dso_live.varsd_active
        code: "mms_adapter.cpp · ccli_main varsd plant path"
      - id: VArSd.VArTgtSptPct
        do: VArTgtSptPct
        cdc: APC
        mms_path: LD_Plant/VArSdDVAR1.VArTgtSptPct
        maps_to: modbus FC16 Q @40003 (lab) / Sun2000 TBD
        code: "dso_reactive_power.cpp · modbus_adapter.write_reactive_kvar"

  # ---------------------------------------------------------------------------
  # Figura 2 — s.p. cosφ — O.9.1 / T Table 90 — LN DFPF prefix PFSP
  # ---------------------------------------------------------------------------
  pfsp:
    figura2: s.p._cosphi
    clause: [O.9.1.1, T.3.1.4]
    annex_t_table: "EN Table 90"
    equation: eq12
    regulation_id: R12
    drawio_ref: "Flowcharts/cosfi. not confirmed.drawio"
    o11_priority: 6
    ln_class: DFPF
    prefix: PFSP
    reference_base: LD_Plant/PFSPDFPF1
    runtime_status: IMPL
    objects:
      - id: PFSP.Mod
        do: Mod
        default: 5
        mms_path: LD_Plant/PFSPDFPF1.Mod
        maps_to: modbus.write_reactive_kvar
      - id: PFSP.PFGnTgtSpt
        do: PFGnTgtSpt
        mms_path: LD_Plant/PFSPDFPF1.PFGnTgtSpt
        maps_to: derive_pfsp_kvar
      - id: PFSP.PFLodTgtSpt
        do: PFLodTgtSpt
        mms_path: LD_Plant/PFSPDFPF1.PFLodTgtSpt
        maps_to: derive_pfsp_kvar

  # ---------------------------------------------------------------------------
  # Figura 2 — Q(V) — O.9.1.3 / T Table 91 — LN DVVR prefix VArV
  # ---------------------------------------------------------------------------
  varv:
    figura2: Q_V
    clause: [O.9.1.3, O.7.3.2, T.3.1.4]
    annex_t_table: "EN Table 91"
    equation: [eq10, eq7_8]
    regulation_id: R10
    drawio_ref: "Flowcharts/Q(V).not confirmed.drawio"
    o11_priority: 6
    ln_class: DVVR
    prefix: VArV
    reference_base: LD_Plant/VArVDVVR1
    runtime_status: STUB
    note: "Slow ring ΔT 10–600 s; δQ default 5 % Qmax"
    objects:
      - id: VArV.Mod
        do: Mod
        default: 5
        mms_path: LD_Plant/VArVDVVR1.Mod
        maps_to: null
        missing: "curve breakpoints V1i..V2s + ΔT scheduler"

  # ---------------------------------------------------------------------------
  # Figura 2 — Cosφ(P) — O.9.1.2 / T Table 92 — LN DPFW prefix PFW
  # ---------------------------------------------------------------------------
  pfw:
    figura2: Cosphi_P
    clause: [O.9.1.2, O.7.3.2, T.3.1.4]
    annex_t_table: "EN Table 92"
    equation: eq11
    regulation_id: R11
    drawio_ref: "Flowcharts/Cosfi(P).not confirmed.drawio"
    o11_priority: 6
    ln_class: DPFW
    prefix: PFW
    reference_base: LD_Plant/PFWDPFW1
    runtime_status: STUB
    note: "δcosφ default α=0.02"
    objects:
      - id: PFW.Mod
        do: Mod
        default: 5
        mms_path: LD_Plant/PFWDPFW1.Mod
        maps_to: null

  # ---------------------------------------------------------------------------
  # MSD WSa — O.10.3.1 / T Table 87 — discretionary (not on Figura 2 TR example)
  # ---------------------------------------------------------------------------
  wsa:
    figura2: null
    clause: [O.10.3.1, T.3.1.4]
    annex_t_table: "EN Table 87 / IT Tab. 86"
    equation: [eq2, eq3]
    regulation_id: null
    drawio_ref: ["Flowcharts/S.P.W.(MSD).not.Confirmed.drawio", "Flowcharts/S.P.Q(MSD).Not. confirmed.drawio"]
    cid_present: false   # MVP hand-built model only; not in lab_tg544_eth_a.cid
    o11_priority: 4
    ln_class: DAGC
    prefix: WSa
    reference_base: LD_Plant/WSaDAGC1
    runtime_status: STUB
    objects:
      - id: WSa.Mod
        do: Mod
        default: 5
        mms_path: LD_Plant/WSaDAGC1.Mod
        maps_to: null

# ---------------------------------------------------------------------------
# Measurements — T.3.1.3 / O.8.3 — PdC MMXU
# ---------------------------------------------------------------------------
measurements:
  pdc:
    clause: [O.8.3, O.8.4, T.3.1.3, T.3.2.1]
    equation: [eq7_8, eq13_17]
    regulation_id: [R09, R06, L01]
    ln_class: MMXU
    prefix: PdC
    reference_base: LD_Plant/PdCMMXU1
    period_s: 4
    runtime_status: PART
    note: "TotW+TotVAr+PPV.phsAB IMPL r22; A deferred"
    objects:
      - id: PdC.TotW
        do: TotW
        fc: MX
        cdc: MV
        presence: mandatory
        unit: kW
        mms_path: LD_Plant/PdCMMXU1.TotW
        runtime_status: IMPL
        maps_to:
          struct: MeasurementStore
          field: p_kw
          code: "mms_adapter.cpp update_tot_w_kw ← modbus_adapter / MeasurementStore"
      - id: PdC.TotVAr
        do: TotVAr
        fc: MX
        cdc: MV
        presence: mandatory
        unit: kVAr
        mms_path: LD_Plant/PdCMMXU1.TotVAr
        runtime_status: IMPL
        maps_to:
          struct: MeasurementStore
          field: q_kvar
          code: "mms_adapter.cpp update_totvar_kvar ← modbus_adapter / MeasurementStore"
      - id: PdC.PPV
        do: PPV
        fc: MX
        cdc: DEL
        presence: mandatory
        unit: kV
        sdo: phsAB.cVal.mag.f
        runtime_status: IMPL
        mms_path: LD_Plant/PdCMMXU1.PPV.phsAB
        maps_to:
          struct: PlantConfig
          field: poc_ppv_kv
          code: "mms_adapter.cpp update_ppv_kv — lab yaml until meter reg (P5-06)"
          gap: "Real analyzer PPV register not mapped on Modbus yet"
      - id: PdC.A
        do: A
        presence: optional
        runtime_status: DEFERRED
        maps_to: null

