# DEPRECATED — out of scope 2026-09-17. Use lab_tr400.yaml on TG544.
platform: pi
interfaces:
  eth_a:
    device: eth0
    address: 192.168.10.2/24
    role: dso
  eth_b:
    device: eth1
    address: 192.168.20.2/24
    role: operator
  plant:
    device: eth0
    vlan: 30
    role: plant
serial:
  rs485_a:
    device: /dev/ttyUSB0
    baud: 9600
    parity: N
    termination: true
modbus:
  mode: tcp
  host: 192.168.30.10
  port: 5020
  slave_id: 1
  poll_ms: 1000
pf2:
  threshold_kw: 900
  debounce_s: 30
  release_threshold_kw: 850
  min_on_s: 60
  min_off_s: 30
  stale_data_s: 10
io:
  do_curtail:
    gpio: 5
    active_high: false
  di_permissive:
    gpio: 27
    active_low: true
