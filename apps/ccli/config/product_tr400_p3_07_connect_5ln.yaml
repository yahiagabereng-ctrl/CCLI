# DEPRECATED duplicate — canonical single application file:
#   apps/ccli/config/ccli_application.yaml  →  /etc/ccli/ccli_application.yaml
# Deploy:
#   powershell -File scripts\push-ccli-application-config.ps1 -RestartCcli
# Or legacy:
#   powershell -File lab/tg544-openwrt/deploy-product-fw-same-cyber.ps1 -LabYaml apps\ccli\config\ccli_application.yaml

platform: tg500
lab:
  hostname: TG544
  model: tespro,tr500
  address: 192.168.1.130/24
  role: operator_eth_b
  meter: chronos_emt432_1p
  meter_ip: 192.168.178.10
  plant_gateway: 192.168.178.1
  bench_note: "5-LN product model · EMT432 TCP · P3-07 Connect TLS · DIO"
  hw:
    plant_meter: emt432_modbus_tcp_lan3_1p
    inverter_mock:
      role: sun2000_rtu_sim
      pc_usb_rs485: COM5
      dut_terminals: A1_B1
      dut_linux_device: /dev/ttyS1
      ccli_polls: false
      start_script: lab/start-bench-plant.ps1
    curtail_relay: dio1_ch1_do
    permissive_button: dio2_ch2_di
    runbook: lab/conformance/TSP_TWO_PC_BENCH_RUNBOOK.md
    tsp_tls_profile: p3_07_connect

modbus:
  backend: tcp
  host: 192.168.178.10
  tcp_port: 502
  slave_id: 1
  poll_ms: 4000
  timeout_ms: 2000
  retries: 3
  trace: true
  reg_active_power: 932
  reg_active_power_count: 2
  reg_reactive_power: 940
  reg_reactive_power_count: 2
  power_scale: 0.001
  reactive_scale: 0.001
  float_word_swap: true
  # RMS phase voltage (screen ~230 V), NOT V_L1_L2_peak @980 (~337 V).
  # Offset 905 = PLC 40906 V_L1_N RMS; × 0.001 → PdCMMXU1.PPV ~ 0.23 kV (not 906 / not 980).
  reg_line_voltage: 906
  reg_line_voltage_count: 2
  line_voltage_scale: 0.001
  reg_phase_a_current: 922
  reg_phase_a_current_count: 2
  phase_a_current_scale: 1.0
  # PdCMMXU1 PPV DEL + A WYE (916–944); on 1P Rogowski unused legs read ~0.
  poll_pdc_3ph: true

pf2:
  threshold_kw: 900
  debounce_s: 30
  release_threshold_kw: 850
  min_on_s: 60
  min_off_s: 30
  stale_data_s: 10
  use_dso_mock: false

plant:
  p_imm_kw: 200
  p_ass_kw: 200
  q_ind_kvar: 50
  q_cap_kvar: 50
  smax_kva: 210
  poc_ppv_kv: 0.23

dso:
  enabled: true
  profile: tr57126_table1
  w110_active: false
  w110_pct: 100
  wlim_active: false
  wmax_spt_pct: 0
  wsd_active: true
  wspt_pct: 20
  release_delta_kw: 5

mms:
  enabled: true
  bind_address: 192.168.10.1
  tcp_port: 3782
  model_cfg: /etc/ccli/icd/product/product_tr400_eth_a_5ln.cfg
  comms_loss_fallback_s: 15
  gnss_poll_s: 15
  gnss_discipline_clock: false
  chrony_poll: true
  tls_enabled: true
  tls_own_key: /etc/ccli/tls/server.key
  tls_own_cert: /etc/ccli/tls/server_tls.pem
  tls_acse_cert: /etc/ccli/tls/server.pem
  tls_acse_key: /etc/ccli/tls/server_acse.key
  tls_ca_cert: /etc/ccli/tls/root_CA.pem
  tls_client_cert: /etc/ccli/tls/client_tls.pem
  tls_acse_client_cert: /etc/ccli/tls/client.pem
  tls_viewer_cert: /etc/ccli/tls/viewer_tls.pem
  tls_chain_validation: true

goose:
  enabled: false
  publish_enabled: false

iec104:
  enabled: true
  bind_address: 192.168.1.130
  tcp_port: 2404
  common_address: 1
  periodic_s: 4
  comms_loss_fallback_s: 60
  operator_rule_mode: monitor_only
  operator_allow_commands: false
  operator_allow_gi: true
  operator_allow_clock_sync: false
  operator_monitor_tot_w: true
  ioa_tot_w: 1001
  operator_monitor_totvar: false
  ioa_tot_var: 1002
  operator_monitor_ppv: false
  ioa_ppv: 1003
  tls_enabled: true
  tls_own_key: /etc/ccli/tls/server.key
  tls_own_cert: /etc/ccli/tls/server_tls.pem
  tls_ca_cert: /etc/ccli/tls/root_CA.pem
  tls_client_cert: /etc/ccli/tls/client_tls.pem

io:
  backend: ubus_dido_v2
  permissive_bypass: false
  do_curtail:
    gpio: 1
    active_high: false
  di_permissive:
    gpio: 2
    active_low: true
  annex_m_trip_monitor:
    enabled: false
    gpio: 3
  do_pf2_spare:
    gpio: 4
    active_high: false

event_log:
  enabled: true
  path: /var/lib/ccli/events.jsonl
  syslog_enabled: true
  syslog_host: 127.0.0.1
  syslog_port: 514
  watch_ifaces: lan1 lan2 lan3
