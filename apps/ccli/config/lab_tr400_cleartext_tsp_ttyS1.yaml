# Lab cleartext P5 — Modbus on A1/B1 screw terminals (/dev/ttyS1).
# Bench verified 2026-10-01: cable on A1/B1 (after A/B swap), NOT rs485_2_uart path.
# Deploy via restart-dut-modbus-check.ps1 or pscp to /etc/ccli/lab.yaml

platform: tg500
lab:
  hostname: TG544
  model: tespro,tr500
  address: 192.168.10.1/24
  role: dso_eth_a_cleartext

modbus:
  backend: rtu
  device: /dev/ttyS1
  baud: 9600
  parity: N
  slave_id: 1
  poll_ms: 4000
  timeout_ms: 2000
  retries: 3
  trace: true

pf2:
  threshold_kw: 900
  debounce_s: 30
  release_threshold_kw: 850
  min_on_s: 60
  min_off_s: 30
  stale_data_s: 10
  use_dso_mock: true

plant:
  p_imm_kw: 200
  p_ass_kw: 200
  q_ind_kvar: 50
  q_cap_kvar: 50
  smax_kva: 210
  poc_ppv_kv: 20.0

dso:
  enabled: true
  profile: tr57126_table1
  w110_active: false
  w110_pct: 100
  wlim_active: false
  wmax_spt_pct: 0
  wsd_active: true
  wspt_pct: 20
  release_delta_kw: 5

mms:
  enabled: true
  bind_address: 0.0.0.0
  tcp_port: 102
  model_cfg: /etc/ccli/icd/lab_tg544_eth_a.cfg
  comms_loss_fallback_s: 15
  gnss_poll_s: 15
  gnss_discipline_clock: false
  chrony_poll: true
  tls_enabled: false

# IED-integrated GOOSE publisher (LLN0 GoCBs in lab_tg544_eth_a.cid)
goose:
  enabled: false
  publish_enabled: true
  interface: br-lan

iec104:
  enabled: true
  bind_address: 192.168.1.130
  tcp_port: 2404
  common_address: 1
  periodic_s: 4
  comms_loss_fallback_s: 60
  operator_rule_mode: monitor_only
  operator_allow_commands: false
  operator_allow_gi: true
  operator_allow_clock_sync: false
  operator_monitor_tot_w: true
  ioa_tot_w: 1001
  operator_monitor_totvar: false
  ioa_tot_var: 1002
  operator_monitor_ppv: false
  ioa_ppv: 1003
  tls_enabled: true
  tls_own_key: /etc/ccli/tls/server.key
  tls_own_cert: /etc/ccli/tls/server_tls.pem
  tls_ca_cert: /etc/ccli/tls/root_CA.pem
  tls_client_cert: /etc/ccli/tls/client_tls.pem

io:
  backend: ubus_dido_v2
  permissive_bypass: true
  do_curtail:
    gpio: 1
    active_high: false
  di_permissive:
    gpio: 2
    active_low: true
  annex_m_trip_monitor:
    enabled: true
    gpio: 3

event_log:
  enabled: true
  path: /var/lib/ccli/events.jsonl
