# CCLI lab chrony — TG544 / T.3.3.4.5
# NTP pool (WAN) + GNSS SOCK feeder from ubus NMEA.
# Disable BusyBox sysntpd before starting chronyd.

user root
driftfile /var/lib/chrony/drift
pidfile /var/run/chronyd.pid
rtcsync
makestep 1.0 3
maxupdateskew 100.0
logdir /var/log/chrony

# Prefer GNSS when feeder is up; NTP as backup.
refclock SOCK /var/run/chrony.gnss.sock poll 4 filter 2 delay 0.5 refid GNSS

server 0.openwrt.pool.ntp.org iburst
server 1.openwrt.pool.ntp.org iburst
server 2.openwrt.pool.ntp.org iburst
server 3.openwrt.pool.ntp.org iburst

allow 127.0.0.1
cmdallow 127.0.0.1
