var msgInfoMsgStr = "<img src='/LAS_FQ/images/common/msg-info.png'/>";
var msgErrorMsgStr = "<img src='/LAS_FQ/images/common/msg-error.png'/>";
var msgAlertMsgStr = "<img src='/LAS_FQ/images/common/msg-alert.png'/>";
var _closeTemplate="<img src='/LAS_FQ/images/common/msg-close.png'/>";

var _topWindowArray = new Array();

function showM(msg) {
		var message = {
			type : "info",
			text : msg
		};
		try {
			showMessage(message);
		} catch (e) {
			alert(e);
		}
	}
	

	function getMessageHeader(_type){
		var v="<div>";
		switch (_type){
			case 'info':
				v+=msgInfoMsgStr;
				v+="消息";
				v+="</div>";
				break;
			case 'error':
				v+=msgErrorMsgStr;
				v+="错误消息";
				v+="</div>";
				break;
			case 'alert':
				v+=msgAlertMsgStr;
				v+="通知";
				v+="</div>";
				break;
			default:
				v+=msgInfoMsgStr;
				v+="消息";
				v+="</div>";
				break;
		}
		return v;
	}
	function  getMessage(_message,_type){
		return _message;
	}
	
	function showMessage(message) {
		var _type = 'info';
 		var _message=message["text"];
		var _stickyV = false;
		var _header="";
		var _expire = message["expire"]?message["expire"]:5000;
		var _theme ='info'; 
		if (message["type"]) {
			_type = message["type"].toLowerCase() == 'error' ? 'error' : message["type"].toLowerCase();
			//_expire = _type== 'info' ? 5000 : 5000;
			_header=getMessageHeader(_type);
			_message=getMessage(_message,_type);
			if (_type == 'error') {
				_stickyV = true;
				_theme ='error'; 
			}else if (_type == 'alert') {
				_stickyV = true;
				_theme ='alert'; 
			}else if (_type == 'info') {
				_stickyV = false;
				_theme ='info'; 
			}else{
				_stickyV = false;
				_theme ='info';
			}
		}
		
		$.jGrowl(_message, {
			header :_header,
			closeTemplate:_closeTemplate,
			theme : _type,
			life : _expire,
			sticky : _stickyV,
			closer : true,
			theme: _theme
		});
	}
 

	
	var getNewTopWindow = function(params) {
		var id = "topWindow" + _topWindowArray.length;
		var v = _topWindowMap[id];

		if (!v || v == null) {
			v = _newTopWindow(params);
			_topWindowMap[id] = v;
		} else {
			_updateTopWindow(v, params);
		}
		_topWindowArray.push(v);
		var url = params.url;
		if(params.data){
			url = addUrlParam(url, coverParamData(params.data));
		}
		v.items[0].setContentsURL(url);
		v.show();
	};

	var _updateTopWindow = function(window, params) {
		window.setTitle(isc.propertyDefined(params, "title") ? params.title
				: '');
		window.setWidth(isc.propertyDefined(params, "width") ? params.title
				: '100%');
		window.setHeight(isc.propertyDefined(params, "height") ? params.title
				: '100%');
		autoSize : isc.propertyDefined(params, "autoSize") ? params.autoSize
				: false;
		window.refreshObj = _updateTopWindow.refreshObj;
		window.refreshMethod = isc.propertyDefined(params, "refreshMethod") ? params.refreshMethod
				: null;
		window.autoRefresh = isc.propertyDefined(params, "autoRefresh") ? params.autoRefresh
				: false;
	};

	var closeCurrentTopWindow = function(params) {
		getCurrentTopWindow().closeClick(params);
	};

	var refreshCurrentTopWindowOpener = function(params) {
		getCurrentTopWindow().forceRefresh(params);
	};
	var topWinClose = function(param){
		closeCurrentTopWindow(param);
	}

		/* if(param == null){

		var rmethod = _topWindowArray[param.winlvl].refreshMethod;

		_runrmethod(rmethod, robj, param); */

	/**
	*设置页面关闭刷新

	function topWinSetAutoRefresh(){
		var _win = getCurrentTopWindow();

	//topwin的刷新父窗口并关闭当前窗口
 	var topWinCloseRefresh=function(param){
 		 if(param == null){
			param = {};
		}
 		/*if(param.winlvl==null){
			param.winlvl = _topWindowArray.length-1;
		}

 	function _runrmethod(_method, _obj, _param){
 		if(_method){
			if(typeof(_method)=='string'){
				_runObjFunction(_obj, _method, _param);
			}else{
				_method(_param);
			}
		}
 	}
 	
	var getCurrentTopWindow = function() {
		if (_topWindowArray.length != 0) {
			return _topWindowArray[_topWindowArray.length - 1];
		} else {
			return null;
		}
	};

	var _newTopWindow = function(params) {

		var _topWindow = isc.Window.create({
			ID : "topWindow" + _topWindowArray.length,
			title : isc.propertyDefined(params, "title") ? params.title: '',
			width : isc.propertyDefined(params, "width") ? params.width: '100%',
			height : isc.propertyDefined(params, "height") ? params.height: '100%',
			autoSize : isc.propertyDefined(params, "autoSize") ? params.autoSize: false,
			autoCenter : true,
			isModal : true,
			showModalMask : true,
			showMaximizeButton : true,
			showMinimizeButton : false,
			autoDraw : false,
			subCallBack : "",
			canDragReposition : isc.propertyDefined(params, "canDragReposition") ? params.canDragReposition: true,
			canDragResize : true,
			refreshObj : params.refreshObj,
			refreshMethod : isc.propertyDefined(params, "refreshMethod") ? params.refreshMethod: null,
			autoRefresh : isc.propertyDefined(params, "autoRefresh") ? params.autoRefresh: false,
			showCloseButton : isc.propertyDefined(params, "showCloseButton") ? params.showCloseButton: true,		
			closeClick : function() {
				try {
					var v = _topWindowArray.pop();
					delete _topWindowMap[v.ID];
					_topWindowArray.remove(_topWindowArray.length - 1);
					eval(this.subCallBack);
				} catch (e) {}
				this.Super("closeClick", arguments);
				this.clearURL({url : ""});
				var param = arguments[0];
				if (this.autoRefresh|| (isc.propertyDefined(param, "refresh") && param.refresh)) {
					try {
						if (this.refreshMethod == null) {
							_runObjFunction(this.refreshObj, "_requery");
						} else if(typeof(this.refreshMethod)=='function'){
							this.refreshMethod(param);
						}else{
							_runObjFunction(this.refreshObj,this.refreshMethod, param);
						}
					} catch (e) {}
				}
			},
			forceRefresh : function() {
				try {
					var param = arguments[0];
					if (this.refreshMethod == null) {
						_runObjFunction(this.refreshObj, "_requery");
					} else if(typeof(this.refreshMethod)=='function'){
						this.refreshMethod(param);
					} else {
						_runObjFunction(this.refreshObj,this.refreshMethod,param);
					}
				} catch (e) {}	 
			},
			clearURL : function(params) {
				this.items[0].setContentsURL("");
			},
			items : [ isc.HTMLPane.create({contentsURL : "",contentsType : "page"}) ],
			openParam:params
		});
		return _topWindow;
	};

		});
		return _topAlertWindow;
	};

	var openTopWindow = function(params) {

	function _runObjFunction(){
		var obj = arguments[0];
		var methodName = arguments[1];
		var param = arguments[2];
		var pass = false;
		if(eval('obj.'+methodName) != null){
			pass = true;
			if(param == null){
				eval('obj.'+methodName+'()');
			}else{
				//alert(param);
				eval('obj.'+methodName)(param);
			}
		}
		return pass;
	}
